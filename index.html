<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071225"><title>Boxkarriere</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#020713;color:#fff;font-family:"Courier New",monospace;display:flex;justify-content:center}#app{width:min(100%,620px);min-height:100vh;background:#071225}.screen{display:none;min-height:100vh;padding:12px}.screen.on{display:block}.full{padding:0;background:#000}.full img{width:100%;min-height:100vh;object-fit:contain;display:block}.tap{position:absolute;inset:0;background:transparent;border:0}.rel{position:relative}.title{text-align:center;color:#ffc21c;text-shadow:3px 3px #9a1c10}.panel{border:4px solid #f5ecd4;background:#0b182b;padding:12px;box-shadow:7px 7px #000;margin-bottom:12px}.btn{width:100%;padding:13px;border:3px solid #f5ecd4;background:#8d241d;color:white;font:bold 16px "Courier New";box-shadow:4px 4px #000;margin-top:8px}.blue{background:#174c82}.gold{background:#a23b10}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.carousel{position:relative;overflow:hidden;touch-action:pan-y}.carousel-card{max-width:430px;margin:0 auto}.carousel-card .pic{display:block}.choose-arrows{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;margin-top:8px}.arrowbtn{height:52px;border:3px solid #f5ecd4;background:#174c82;color:#fff;font:bold 28px "Courier New";box-shadow:4px 4px #000}.pickname{text-align:center;color:#ffc21c;font-size:20px;font-weight:bold}.swipehint{text-align:center;color:#aab8cc;font-size:12px;margin:8px 0}.pic{width:100%;border:3px solid #ffc21c}.opp{max-height:62vh;object-fit:contain}.small{color:#aab8cc;font-size:12px}.brand img{width:92px;max-width:28vw;height:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 2px 4px #000)}
.brand{text-align:center;color:#ffc21c;font-weight:bold;letter-spacing:2px;font-size:11px;margin:10px 0 2px;text-shadow:2px 2px #000}.route{text-align:center;color:#aab8cc;font-size:11px;margin:5px 0 10px}.stats{display:flex;justify-content:space-around;color:#ffc21c;font-weight:bold}.phase{border:3px solid #52657d;background:#050b14;padding:10px;margin:9px 0;line-height:1.35}.tactics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tactics .btn{font-size:12px;padding:10px 4px}.bars{display:grid;grid-template-columns:1fr 1fr;gap:7px}.barbox{border:2px solid #eee2c6;padding:5px;font-size:11px}.bar{height:14px;background:#303a49}.fill{height:100%;background:#31ce7b}.summary{border:3px solid #ffc21c;background:#10182a;padding:10px}.joke{background:#281a09;border-left:5px solid #ffc21c;padding:8px;margin:8px 0;font-size:12px}.score{width:100%;border-collapse:collapse;font-size:12px}.score td,.score th{border:1px solid #66758b;padding:5px;text-align:center}.score td:first-child{text-align:left}@media(max-width:480px){.cards{grid-template-columns:1fr}.tactics{grid-template-columns:1fr}.opp{max-height:57vh}}
</style></head><body><div id="app">
<section id="start" class="screen full on"><div class="rel"><img src="images/start.jpeg"><button class="tap" onclick="show('choose')"></button></div></section>
<section id="choose" class="screen"><div class="brand"><img src="images/aguirre-games.png" alt="Aguirre Games"></div><h1 class="title">WÄHLE DEINEN BOXER</h1>
<div id="boxerCarousel" class="panel carousel">
  <div class="carousel-card">
    <img id="boxerImg" class="pic" src="images/technician.jpeg" alt="Ausgewählter Boxer">
    <div class="choose-arrows">
      <button class="arrowbtn" type="button" onclick="switchBoxer(-1)" aria-label="Vorheriger Boxer">←</button>
      <div id="boxerName" class="pickname">TECHNICIAN</div>
      <button class="arrowbtn" type="button" onclick="switchBoxer(1)" aria-label="Nächster Boxer">→</button>
    </div>
    <div class="swipehint">← Pfeile tippen oder nach links/rechts wischen →</div>
    <button class="btn gold" onclick="confirmBoxer()">DIESEN BOXER WÄHLEN</button>
  </div>
</div></section>
<section id="opp" class="screen"><div class="brand"><img src="images/aguirre-games.png" alt="Aguirre Games"></div><h1 class="title">NÄCHSTER GEGNER</h1><div id="route" class="route"></div><div class="panel"><img id="oppImg" class="pic opp"><div class="stats"><span id="pow"></span><span id="spd"></span><span id="def"></span></div><div id="trait" class="small" style="text-align:center;margin-top:8px"></div></div><button class="btn gold" onclick="startFight()">🥊 ZUM KAMPF</button></section>
<section id="fight" class="screen"><div class="brand"><img src="images/aguirre-games.png" alt="Aguirre Games"></div><h1 id="round" class="title"></h1><div class="bars"><div class="barbox">DU <span id="phpt">100</span><div class="bar"><div id="php" class="fill"></div></div></div><div class="barbox">GEGNER <span id="ohpt">100</span><div class="bar"><div id="ohp" class="fill"></div></div></div></div>
<div class="phase"><b id="phase"></b><div id="text">Der Gong ertönt. Wähle deine Taktik.</div></div>
<div id="tactics" class="tactics"><button class="btn" onclick="play('a')">🔥 AGGRESSIV</button><button class="btn gold" onclick="play('b')">🥊 BALANCE</button><button class="btn blue" onclick="play('d')">🛡️ DEFENSIV</button></div>
<div id="summary" class="summary" style="display:none"><h2 id="rw" class="title"></h2><div id="rs"></div><div id="joke" class="joke"></div><table class="score"><tr><th></th><th>R1</th><th>R2</th><th>R3</th><th>Σ</th></tr><tr><td>DU</td><td id="p0">–</td><td id="p1">–</td><td id="p2">–</td><td id="pt">0</td></tr><tr><td>GEGNER</td><td id="o0">–</td><td id="o1">–</td><td id="o2">–</td><td id="ot">0</td></tr></table><button id="next" class="btn gold" onclick="nextRound()">NÄCHSTE RUNDE</button></div></section>
<section id="result" class="screen"><div class="brand"><img src="images/aguirre-games.png" alt="Aguirre Games"></div><div class="panel" style="margin-top:20vh;text-align:center"><h1 id="rt" class="title"></h1><p id="rr"></p><div id="fs" class="joke"></div><button id="cont" class="btn gold" onclick="cont()">WEITER</button></div></section>
<section id="victory" class="screen full"><div class="rel"><img src="images/victory.jpeg"><button class="tap" onclick="resetGame()"></button></div></section>
</div><script>
const ALL=[
{name:"BIG TONY",img:"images/big-tony.jpeg",power:95,speed:48,def:70,trait:"Zwei Treffer können reichen."},
{name:"RED IVAN",img:"images/red-ivan.jpeg",power:98,speed:35,def:80,trait:"Brutale Schlagkraft. Kaum Tempo."},
{name:"EL TORO",img:"images/el-toro.jpeg",power:82,speed:78,def:55,trait:"Wird gefährlicher, wenn er zurückliegt."},
{name:"LE DUC",img:"images/le-duc.jpeg",power:65,speed:88,def:87,trait:"Schwer zu treffen. Liebt Beschwerden beim Ringrichter."},
{name:"BULLDOG BILL",img:"images/bulldog-bill.jpeg",power:88,speed:55,def:75,trait:"Steckt unglaublich viel ein."},
{name:"EL RELÁMPAGO",img:"images/el-relampago.jpeg",power:70,speed:96,def:73,trait:"Der schnellste Mann im Turnier."}
];
const CHAMP={name:"UNCLE SAM",img:"images/uncle-sam.jpeg",power:85,speed:40,def:70,trait:"WELTMEISTER · Der letzte Kampf."};
let O=[];
function newCareer(){O=[...ALL].sort(()=>Math.random()-.5);O.push(CHAMP)}
const J=["🌹 El Toro wirft eine Rose ins Publikum. Die Runde läuft allerdings schon.","☕ Bulldog Bill verlangt zwischen zwei Treffern Tee. Mit Milch.","🥐 Le Duc diskutiert über die Temperatur seines Wassers.","⚡ El Relámpago war gerade noch links. Jetzt ist er rechts. Vermutlich.","🚽 Kampfunterbrechung: Du musst dringend auf die Toilette. Dein Trainer nennt es taktische Verzögerung.","🤢 Dein Gegner sieht plötzlich kreidebleich aus. Angst oder der Hotdog vor dem Kampf?","🪣 Dein Trainer sucht den Wassereimer. Er steht direkt neben ihm.","📣 Ein Zuschauer brüllt seit zwei Minuten völlig falsche Anweisungen.","🥨 Eine Brezel fliegt in den Ring. Niemand weiß warum.","💬 Im Clinch flüstert dein Gegner: „Müssen wir das wirklich machen?“","😤 Dein Gegner will kurz nicht aus seiner Ecke kommen. Sein Trainer erinnert ihn an die Gage.","📸 Ein Zuschauer fotografiert mit Blitz. Dein Gegner posiert reflexartig.","🥤 Dein Trainer reicht aus Versehen Apfelschorle. Er behauptet, Elektrolyte seien Elektrolyte.","🎺 Jemand im Publikum besitzt eine Tröte. Leider."];
let type="technician",career=0,r=1,q=1,HP=100,OH=100,pa=[],oa=[],rp=0,ro=0,pk=0,ok=0,lastWin=false;
const BOXERS=[
 {type:"technician",name:"TECHNICIAN",img:"images/technician.jpeg"},
 {type:"slugger",name:"SLUGGER",img:"images/slugger.jpeg"}
];
let boxerIndex=0,touchStartX=0;
const $=id=>document.getElementById(id);function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));$(id).classList.add("on");scrollTo(0,0)}
function gong(){try{let A=window.AudioContext||window.webkitAudioContext,a=new A,o=a.createOscillator(),g=a.createGain();o.frequency.value=720;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.7)}catch(e){}}
function renderBoxer(){let b=BOXERS[boxerIndex];$("boxerImg").src=b.img;$("boxerName").textContent=b.name}
function switchBoxer(dir){boxerIndex=(boxerIndex+dir+BOXERS.length)%BOXERS.length;renderBoxer()}
function confirmBoxer(){type=BOXERS[boxerIndex].type;career=0;newCareer();loadOpp()}
function choose(t){type=t;career=0;newCareer();loadOpp()}function loadOpp(){let o=O[career];$("oppImg").src=o.img;$("pow").textContent="POWER "+o.power;$("spd").textContent="SPEED "+o.speed;$("def").textContent="DEF "+o.def;$("trait").textContent=o.trait||"";$("route").textContent=o===CHAMP?"🏆 TITELKAMPF · 7/7":"KAMPF "+(career+1)+"/7 · Der Weg zum Titel";show("opp")}
function ui(){$("round").textContent="RUNDE "+r;$("phase").textContent=q+". RUNDENDRITTEL · TAKTIK?";$("php").style.width=Math.max(0,HP)+"%";$("ohp").style.width=Math.max(0,OH)+"%";$("phpt").textContent=Math.max(0,Math.round(HP));$("ohpt").textContent=Math.max(0,Math.round(OH))}
function startFight(){r=q=1;HP=OH=100;pa=[];oa=[];rp=ro=pk=ok=0;$("summary").style.display="none";$("tactics").style.display="grid";$("text").textContent="Der Gong ertönt. Wähle deine Taktik.";ui();show("fight");gong()}
function play(t){let o=O[career],pp=type==="slugger"?90:68,ps=type==="slugger"?55:90,pd=type==="slugger"?52:82,am=t==="a"?1.3:t==="d"?.72:1,dm=t==="d"?1.4:t==="a"?.72:1,pc=Math.min(.9,(ps*(t==="d"?1.08:1))/(o.def+34));let odmg=0,pdmg=0,s=[];
if(Math.random()<pc){odmg=Math.round((7+Math.random()*10)*(pp/72)*am);OH-=odmg;rp+=odmg;s.push(odmg>16?"💥 Du landest einen Volltreffer!":"🥊 Du kommst sauber durch.")}else s.push("Dein Angriff geht daneben.");
let oc=Math.min(.87,o.speed/(pd*dm*.55+25));if(OH>0&&Math.random()<oc){pdmg=Math.round((6+Math.random()*10)*(o.power/78));HP-=pdmg;ro+=pdmg;s.push(pdmg>15?"Du kassierst einen harten Konter.":"Der Gegner trifft ebenfalls.")}else if(OH>0)s.push("Du weichst dem Gegenangriff aus.");
if(OH<50&&OH>0&&Math.random()<.13+(type==="slugger"?.08:0)){OH-=8;rp+=16;ok++;s.push("💥 NIEDERSCHLAG! Gegner am Boden!")}if(HP<50&&HP>0&&Math.random()<.11){HP-=8;ro+=16;pk++;s.push("💢 Du musst auf die Bretter!")}
$("text").innerHTML=s.join(" ");ui();if(HP<=0||OH<=0)return finish(true);if(q<3){q++;ui()}else endRound()}
function endRound(){let p=10,o=9;if(ro>rp){p=9;o=10}if(Math.abs(rp-ro)<3){p=o=10}o=Math.max(7,o-ok);p=Math.max(7,p-pk);pa.push(p);oa.push(o);$("rw").textContent=p>o?"RUNDE AN DICH · "+p+":"+o:o>p?"RUNDE AN "+O[career].name+" · "+p+":"+o:"UNENTSCHIEDENE RUNDE · "+p+":"+o;$("rs").textContent=rp>ro+7?"Du hattest die klareren Aktionen und bestimmtest die Runde.":ro>rp+7?"Der Gegner landete die besseren Treffer. Zeit für eine Anpassung.":"Eine enge Runde mit guten Aktionen auf beiden Seiten.";$("joke").textContent=J[Math.floor(Math.random()*J.length)];for(let i=0;i<3;i++){$("p"+i).textContent=pa[i]??"–";$("o"+i).textContent=oa[i]??"–"}$("pt").textContent=pa.reduce((a,b)=>a+b,0);$("ot").textContent=oa.reduce((a,b)=>a+b,0);$("tactics").style.display="none";$("summary").style.display="block";$("next").textContent=r===3?"ZUM URTEIL":"NÄCHSTE RUNDE"}
function nextRound(){if(r===3)return finish(false);r++;q=1;rp=ro=pk=ok=0;$("summary").style.display="none";$("tactics").style.display="grid";$("text").textContent="Neue Runde. Du kannst deine Taktik neu festlegen.";ui();gong()}
function finish(ko){let P=pa.reduce((a,b)=>a+b,0),Q=oa.reduce((a,b)=>a+b,0),draw=!ko&&P===Q;lastWin=ko?OH<=0&&HP>0:P>Q;if(draw){$("rt").textContent="UNENTSCHIEDEN";$("rr").textContent="Die Punktrichter wollen eine Revanche. Du vermutlich auch.";lastWin=false}else if(lastWin){$("rt").textContent=ko?"K.O.-SIEG!":"PUNKTSIEG!";$("rr").textContent="Du hast "+O[career].name+" besiegt."}else{$("rt").textContent=ko?"K.O.-NIEDERLAGE":"NIEDERLAGE";$("rr").textContent=O[career].name+" war heute stärker."}$("fs").textContent=ko?"Der Kampf endet vorzeitig.":"Punkte: "+P+" : "+Q;$("cont").textContent=lastWin?(career===O.length-1?"TITEL FEIERN":"NÄCHSTER GEGNER"):"REVANCHE";show("result")}
function cont(){if(!lastWin)return startFight();if(career===O.length-1)return show("victory");career++;loadOpp()}function resetGame(){career=0;O=[];show("choose")}
const carousel=$("boxerCarousel");
carousel.addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});
carousel.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>45)switchBoxer(dx<0?1:-1)},{passive:true});
renderBoxer();
</script></body></html>
